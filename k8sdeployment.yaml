apiVersion: apps/v1
kind: Deployment
metadata:
  name: prt-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prt-app
  template:
    metadata:
      labels:
        app: prt-app
    spec:
      containers:
        - name: prt-app
          image: janakdasari/prt-cicd:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: prt-service
spec:
  type: NodePort
  selector:
    app: prt-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
